    serialization:
      write-dates-as-timestamps: false
  application:
    name: common-template
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/an_project
    username: root
    password: 20030517
server:
  port: 8123
